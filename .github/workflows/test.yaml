name: flysystem-bundle

on:
    pull_request: ~
    push:
        branches:
            - 1.x
            - 2.x
            - 3.x

jobs:
    coding-style:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v3
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  coverage: none
            - name: php-cs-fixer
              run: |
                  wget https://github.com/FriendsOfPHP/PHP-CS-Fixer/releases/download/v3.85.1/php-cs-fixer.phar -q
                  php php-cs-fixer.phar fix --dry-run --diff

    phpunit:
        name: PHPUnit (PHP ${{ matrix.php-version }} - Symfony ${{ matrix.symfony-version }})
        runs-on: ubuntu-latest
        env:
            SYMFONY_REQUIRE: ${{ matrix.symfony-version }}

        strategy:
            matrix:
                php-version:
                    - '8.4'
                symfony-version:
                    - '5.4.*'
                    - '6.4.*'
                    - '7.4.*'
                    - '8.0.*'
                include:
                    - php-version: '8.0'
                      symfony-version: '5.4.*'
                    - php-version: '8.2'
                      symfony-version: '6.4.*'
                    - php-version: '8.2'
                      symfony-version: '7.4.*'
                    - php-version: '8.4'
                      symfony-version: '8.0.*'

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install PHP with pcov
              uses: shivammathur/setup-php@v2
              with:
                coverage: none
                php-version: ${{ matrix.php-version }}
                extensions: mongodb-1.21.0

            - name: Install Symfony Flex
              run: |
                  composer config --global --no-plugins allow-plugins.symfony/flex true
                  composer global require --no-progress --no-scripts --no-plugins symfony/flex

            - name: Install Composer dependencies
              uses: ramsey/composer-install@v2
              with:
                dependency-versions: highest

            - name: Run PHPUnit
              run: vendor/bin/simple-phpunit
